name: Deploy Dayline

# Publishes calendar-app/ to GitHub Pages.
#
# configure-pages turns Pages on by itself the first time this runs. Doing
# that needs the repo-administration permission for just this one job (that
# grant lives only inside this run's short-lived token, scoped to this repo,
# and is never exposed to the app code being deployed) — pages:write alone
# only covers deploying to a site that already exists.

on:
  push:
    branches: [main]
    paths:
      - 'calendar-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      administration: write   # first-run only: lets configure-pages create the site
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: calendar-app
      - id: deploy
        uses: actions/deploy-pages@v4

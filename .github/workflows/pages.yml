name: Deploy Dayline

# Publishes calendar-app/ to GitHub Pages.
#
# One-time manual step before the first run: repo Settings → Pages →
# Build and deployment → Source → "GitHub Actions". The default GITHUB_TOKEN
# cannot create a Pages site by itself (that needs an "administration" scope
# it does not support), so configure-pages can only deploy to a site that
# already exists — it cannot switch this on for you.

on:
  push:
    branches: [main]
    paths:
      - 'calendar-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: calendar-app
      - id: deploy
        uses: actions/deploy-pages@v4
